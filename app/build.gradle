plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '2.3.0'
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "com.databits.androidscouting"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }



    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
  compileOptions {
    sourceCompatibility = 21
    targetCompatibility = 21
  }

  buildFeatures {
        viewBinding = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    namespace = 'com.databits.androidscouting'
}

dependencies {
    implementation project(':core-model')
    implementation project(':core-domain')
    implementation project(':core-data')
    implementation project(':feature-scanner')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Room components for structured data storage
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation 'com.tngtech.archunit:archunit:1.0.1'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'

    implementation('com.github.sumimakito:AwesomeQRCode:1.2.0') {
      exclude group: 'com.waynejo', module: 'androidndkgif'
    }
    implementation 'com.google.zxing:core:3.5.4'

    def camerax_version = "1.5.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation "com.google.mlkit:barcode-scanning:17.3.0"

    implementation 'androidx.camera:camera-mlkit-vision:1.5.2'

    implementation 'com.github.piphagor:SegmentedButton:3.2.0'

    // Json Parser/Writer
    implementation("com.squareup.moshi:moshi:1.15.2")
    implementation("com.squareup.moshi:moshi-kotlin:1.15.2")
    ksp("com.squareup.moshi:moshi-kotlin-codegen:1.15.2")

    // Segmented Button UI
    implementation 'com.github.piphagor:SegmentedButton:3.2.0'

    // Number picker UI
    implementation 'com.github.travijuu:numberpicker:1.0.7'

    // Cross application value storage
    implementation 'com.github.AliAsadi:PowerPreference:2.1.1'

    implementation('com.google.api-client:google-api-client-android:2.8.1') {
        exclude group: 'org.apache.httpcomponents'
    }

    implementation('com.google.android.gms:play-services-auth:21.5.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    implementation('com.google.apis:google-api-services-sheets:v4-rev571-1.25.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    implementation group: 'com.opencsv', name: 'opencsv', version: '5.12.0'

    // Drawing for map
    implementation 'com.github.Miihir79:DrawingCanvas:1.1.2'
    implementation 'com.github.deadman96385:Android-ColorPicker:1.0'

    // Popup text for help system
    implementation "com.github.skydoves:balloon:1.7.3"

    // File system access helper
    implementation "com.anggrayudi:storage:2.2.0"

    implementation "net.lingala.zip4j:zip4j:2.11.5"

    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'
}
